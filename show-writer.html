<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickverse Show Writer</title><style>:root{color-scheme:dark;font-family:system-ui;background:#090e1b;color:#eef4ff}*{box-sizing:border-box}body{max-width:850px;margin:auto;padding:16px}.panel{background:#142036;border:1px solid #34435c;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select{width:100%;background:#0b1424;color:white;border:1px solid #4c5b74;border-radius:10px;padding:12px;font:inherit}textarea{min-height:150px}label{display:block;margin:12px 0 5px;font-weight:650}button{padding:13px 17px;background:#44dcc8;border:0;border-radius:10px;color:#061520;font-weight:800;margin:7px 5px 7px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#081222;padding:15px;border-radius:12px}p,small{color:#adbad0}.scene{border-bottom:1px solid #34435c;padding:12px 0}.tag{color:#67e7d5;font-weight:bold}</style></head><body><h1>🎭 Stickverse Show Writer</h1><p>Narrator + character dialogue · Costume and expression planning · Android friendly</p><div class="panel"><label>Show topic / title</label><input id="title" value="The First Job in Human History"><label>Setting</label><select id="setting"><option>Prehistoric Cave</option><option>Modern City</option><option>Haunted Town</option><option>Space Station</option><option>Ancient Kingdom</option></select><label>Character costume</label><select id="costume"><option>Spotted Caveman Tunic</option><option>Casual Hoodie</option><option>Business Suit</option><option>Lab Coat</option><option>Explorer Outfit</option></select><label>Script (Narrator: / Hero: / Other:)</label><textarea id="script">Narrator: Thousands of years ago, finding a job was a matter of survival.
Hero: So, what exactly is my job?
Other: You hunt the food. I eat the food.
Hero: Wait. How is that fair?
Narrator: And just like that, the world's first workplace argument began.</textarea><button id="generate">Generate shot plan</button><button id="copy">Copy shot plan</button><button id="save">Download JSON</button><p id="status"></p></div><div class="panel"><h2>Automatic scene breakdown</h2><div id="scenes"></div><pre id="output"></pre><small>This is an editable screenplay and visual-direction generator, not a finished video or automatic AI art/voice renderer.</small></div><script src="./show-writer.js"></script></body></html>
